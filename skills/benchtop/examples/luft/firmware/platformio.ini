; GENERATED by benchtop firmware.ts from project.json.
; Regenerated on every run: change libs and board in project.json, not here.

[platformio]
default_envs = main

; Shared by both environments.
[env]
; Pinned, not 'espressif32': a new release can change the Arduino core and board
; definitions under a project that built yesterday. 8.0.0 was the latest stable
; release in the PlatformIO registry on 2026-11-13. Bump it deliberately and rebuild both envs.
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Native USB: route Serial to USB CDC. On a board whose USB port goes through a
; UART bridge chip (some S3 devkits), remove the two ARDUINO_USB lines or Serial goes silent.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; The real firmware: src/main.cpp.
[env:main]
build_src_filter = +<*> -<bringup.cpp>
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit BME280 Library

; Bring-up sketch: proves wiring before the real firmware exists. Needs no libraries.
[env:bringup]
build_src_filter = +<*> -<main.cpp>
